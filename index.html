<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 14px;
    min-height: 100vh;
   background-image: linear-gradient(200deg, #93a5cf 0%, #e4efe9 100%);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .page {
    max-width: 400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .heading {
   text-align: center;
    color: #ffffff;
    font-size: 32px;
    font-weight: 500;
    margin: 0 0 10px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    letter-spacing: 0.2px;
  }

  .card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(155deg, #ffffff 0%, #f6f4ff 100%);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 20px rgba(31, 20, 60, 0.25), 0 2px 6px rgba(31, 20, 60, 0.15);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .ribbon {
    position: absolute;
    top: 14px;
    right: -34px;
    width: 130px;
    padding: 4px 0;
    background: linear-gradient(135deg, #265492, #1b799e);
    color: #dcdcdc;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-align: center;
    text-shadow: 0 1px 1px rgba(255,255,255,0.3);
    transform: rotate(45deg);
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(31, 20, 60, 0.3), 0 4px 10px rgba(31, 20, 60, 0.2);
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #ffffff;
    flex-shrink: 0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .card-info {
    flex: 1;
    min-width: 0;
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .name {
    font-weight: 600;
    font-size: 16px;
    margin: 0;
    color: #241f42;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .preview-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    background: linear-gradient(135deg, #6a7da6, #1f4cce);
    color: #ffffff;
    white-space: nowrap;
    box-shadow: 0 2px 5px rgba(127, 119, 221, 0.4);
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease;
  }

  .preview-pill:hover {
    transform: translateY(-1px);
  }

  .preview-pill svg {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
  }

  .meta {
    font-size: 12px;
    color: #6b6a63;
    margin: 4px 0 0;
  }

  .desc {
    font-size: 11px;
    color: #9a5b1f;
    background: #fff3e0;
    border-left: 3px solid #ef9f27;
    padding: 6px 8px;
    border-radius: 6px;
    margin: 20px 0 0;
    line-height: 1.4;
  }

  .star {
    color: #ef9f27;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .btn {
    text-decoration: none;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #378add, #4f5fdb);
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(55, 138, 221, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover {
    text-decoration: underline;
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(55, 138, 221, 0.45);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-icon {
    width: 40px;
    flex: none;
    background: linear-gradient(135deg, #e2504f, #c0392b);
    box-shadow: 0 4px 10px rgba(194, 57, 43, 0.35);
  }

  .btn-icon:hover {
    box-shadow: 0 6px 14px rgba(194, 57, 43, 0.45);
  }
